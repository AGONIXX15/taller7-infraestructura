apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taller7-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: taller7-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8085}]
          envFrom:
            - secretRef: {name: db-credentials}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8085}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8085}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taller7-app
spec:
  type: LoadBalancer
  selector: {app: api}
  ports: [{port: 8085, targetPort: 8085}]
